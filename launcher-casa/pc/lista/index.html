<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lista de MIA</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#fff;--muted:#A6A6A6;--field:#2B2B2E;--blue:#006CC1;--amber:#FFB000}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
.eyebrow{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0 0 14px;font-size:40px;line-height:1.1;font-weight:300}
h2{margin:28px 0 8px;font-size:20px;font-weight:600;color:var(--amber)}
form{display:flex;gap:6px;margin-bottom:10px}
input{flex:1;min-width:0;height:48px;border:0;border-bottom:2px solid #fff;background:var(--field);color:var(--fg);font:inherit;font-size:17px;padding:0 14px;border-radius:0;outline:none}
input:focus{border-bottom-color:var(--amber)}
button{border:0;background:var(--blue);color:#fff;font:inherit;font-size:15px;min-height:48px;padding:0 16px;cursor:pointer}
ul{list-style:none;margin:0;padding:0}
li{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#1b1b1d;margin-bottom:2px;padding:6px 6px 6px 14px;min-height:52px;font-size:17px}
li button{background:var(--field);min-height:44px}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.vacio{color:var(--muted);padding:10px 0}
#msg{color:var(--muted);font-size:13px;min-height:18px;margin-top:8px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">Casa</div>
  <h1>Lista</h1>
  <h2>Lista de compras</h2>
  <form id="f" autocomplete="off">
    <input id="t" type="text" placeholder="Agregar (podés poner varias separadas por coma)" aria-label="Agregar a la lista">
    <button type="submit">Agregar</button>
  </form>
  <ul id="compras"></ul>
  <h2>Recordatorios</h2>
  <ul id="recs"></ul>
  <div id="msg"></div>
</main>
<script>
(function(){
  var msg=document.getElementById('msg');
  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function pintar(d){
    var c=document.getElementById('compras'), r=document.getElementById('recs');
    c.innerHTML=(d.compras&&d.compras.length)?'':'<div class="vacio">La lista está vacía.</div>';
    (d.compras||[]).forEach(function(x){
      var li=document.createElement('li'); li.innerHTML='<span>'+esc(x)+'</span>';
      var b=document.createElement('button'); b.type='button'; b.textContent='Listo'; b.setAttribute('aria-label','Sacar '+x);
      b.addEventListener('click',function(){ enviar({accion:'del',texto:x}); }); li.appendChild(b); c.appendChild(li);
    });
    r.innerHTML=(d.recordatorios&&d.recordatorios.length)?'':'<div class="vacio">No hay recordatorios pendientes.</div>';
    (d.recordatorios||[]).forEach(function(x){
      var li=document.createElement('li'); li.innerHTML='<span>'+esc(x.texto)+'<div class="sub">'+esc(x.cuando||'sin fecha')+(x.repite?' · se repite':'')+'</div></span>';
      var b=document.createElement('button'); b.type='button'; b.textContent='Hecho';
      b.addEventListener('click',function(){ enviar({accion:'hecho',id:x.id}); }); li.appendChild(b); r.appendChild(li);
    });
  }
  function enviar(o){
    msg.textContent='';
    fetch('/lista/accion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(o)})
      .then(function(r){return r.json();}).then(pintar).catch(function(){msg.textContent='No pude hablar con MIA. ¿Está prendida la PC?';});
  }
  function cargar(){
    fetch('/lista/datos.json',{cache:'no-store'}).then(function(r){return r.json();}).then(pintar).catch(function(){msg.textContent='No pude hablar con MIA. ¿Está prendida la PC?';});
  }
  document.getElementById('f').addEventListener('submit',function(e){
    e.preventDefault(); var t=document.getElementById('t'); var v=t.value.trim(); if(!v) return;
    t.value=''; enviar({accion:'add',texto:v});
  });
  cargar(); setInterval(cargar,20000);
})();
</script>
</body>
</html>
