name: Compilar launcher (APK)

on:
  push:
    branches: [launcher]
    paths:
      - "launcher-casa/**"
      - ".github/workflows/launcher-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Compilar
        working-directory: launcher-casa
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp launcher-casa/app/build/outputs/apk/debug/app-debug.apk casa-launcher.apk
          gh release view launcher-latest >/dev/null 2>&1 || \
            gh release create launcher-latest --prerelease \
              --title "Launcher Casa (ultima version)" \
              --notes "APK del launcher de casa inteligente. Se actualiza solo en cada compilacion." \
              --target "${{ github.sha }}"
          gh release upload launcher-latest casa-launcher.apk --clobber
