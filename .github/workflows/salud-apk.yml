name: Compilar MIA Salud (APK)

on:
  push:
    branches: [launcher]
    paths:
      - "salud-mia/**"
      - ".github/workflows/salud-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Clave de firma estable (se guarda en el cache de GitHub, no en el repo)
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-salud-v1

      - name: Compilar
        working-directory: salud-mia
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publicar APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp salud-mia/app/build/outputs/apk/debug/app-debug.apk salud-mia.apk
          gh release view salud-latest >/dev/null 2>&1 || \
            gh release create salud-latest --prerelease \
              --title "MIA Salud (ultima version)" \
              --notes "APK de MIA Salud (lee Health Connect). Se actualiza solo en cada compilacion." \
              --target "${{ github.sha }}"
          gh release upload salud-latest salud-mia.apk --clobber
